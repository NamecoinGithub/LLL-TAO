name: Devcontainer Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/devcontainer-validate.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".devcontainer/**"
      - "contrib/devtools/install-build-deps.sh"
      - "makefile.cli"
      - "src/**"
      - "tests/**"
      - "README.md"
      - "docs/**"
  pull_request:
    paths:
      - ".github/workflows/devcontainer-validate.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".devcontainer/**"
      - "contrib/devtools/install-build-deps.sh"
      - "makefile.cli"
      - "src/**"
      - "tests/**"
      - "README.md"
      - "docs/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 9ac000957b34151f77a3cc12be80ea2ad77bbd90

      - name: Install build dependencies
        run: sudo bash "${GITHUB_WORKSPACE}/contrib/devtools/install-build-deps.sh"

      - name: Unit-test build
        run: make -f makefile.cli UNIT_TESTS=1 -j2

      - name: Test mining readiness
        run: |
          export HOME="$RUNNER_TEMP/nexus-test-home"
          mkdir -p "$HOME"
          timeout 300 ./nexus '[mining-readiness]'
